### Target Datasets
target_datasets:
  - name: BBBC039

### Source Models
source_models:
  - source_name: BBBC039
    model_name: BC_model

### Perturbation Settings

# Feature perturbations
feature_perturbations:
  random_seed: 42
  layers: [0]
  spatial_dropout: True
  perturbation_types:
    - "None"
    - "DropOutPerturbation"
  dropOut_rates:
    - 0.05
  featureDrop_thresholds: null
  featureNoise_ranges: null 

# Input Augmentations
input_augs:
    none: []

### General Run Settings
overwrite_yaml: False
segmentation_mode: semantic
run_mode: full
data_base_path: /scratch/talks/data
model_dir_path: /g/kreshuk/talks/Models
summary_results:
  overwrite_scores: False

# Output Settings
output_settings:
  result_dir: exp1
  approach: feature_perturbation_consistency
  base_dir_path: /g/kreshuk/talks/model_ranking/tests


### Performance and Consistency evaluation settings
eval_settings:
  name: MultiClassF1
  eval_save_key: F1_eval
  overwrite_score: True

consistency_settings:
  name: Hamming-Distance
  save_key: HD_consis
  save_mask: True
  mask_threshold: 0.5
  overwrite_score: True
