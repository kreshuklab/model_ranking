wandb:
  project: Rmito_predictions
  name: Rm_model_NA2_RmtoE_none
  mode: offline

model_path: /g/kreshuk/talks/segmentation_ModelSelection/experiments/Rmito/BatchNorm/Rm_model_NA2/best_checkpoint.pytorch

model_key: model_state_dict

# summary_results:
#   filter_patches: null
#   output_path: /g/kreshuk/talks/model_ranking/notebooks/model_selection/consistency/mitochondria/predictions
#   eval_key: hard_f1
#   consis_key: EI_consis
#   overwrite_scores: true
#   save_name_postfix: _full

model:
  name: UNet2D
  in_channels: 1
  out_channels: 1
  layer_order: bcr
  f_maps: 32
  final_sigmoid: true
  feature_return: false
  is_segmentation: true
  feature_perturbation: null

predictor:
  name: PatchWisePredictor
  save_segmentation: false
  min_size: null
  layer_id: null
  zero_largest_instance: false
  no_adjust_background: false

loaders:
  dataset: StandardHDF5Dataset
  batch_size: 32
  num_workers: 8
  raw_internal_path: raw
  label_internal_path: labels
  global_normalization: true
  global_percentiles: null
  output_dir: /g/kreshuk/talks/model_ranking/notebooks/model_selection/consistency/mitochondria/predictions
  test:
    file_paths:
    - /scratch/talks/data/EPFL/test.h5
    slice_builder:
      name: SliceBuilder
      patch_shape: [1, 256, 256]
      stride_shape: [1, 256, 256]
      halo_shape: [0, 32, 32]
    transformer:
      raw:
      - name: Normalize
      - name: ToTensor
        expand_dims: true
    roi: null

evaluation:
  eval_dataloader:
    eval_dataset:
      name: StandardEvalDataset
      aug_name: predictions
      pred_path: [/g/kreshuk/talks/model_ranking/notebooks/model_selection/consistency/mitochondria/predictions]
      gt_path:
      - /scratch/talks/data/EPFL/test.h5
      pred_key: predictions
      gt_key: labels
      patch_key: patch_index
      roi: null
      ignore_index: null
      ignore_path: null
      ignore_key: null
      convert_to_binary_label: false
      convert_to_boundary_label: false
      relabel_background: false
      min_object_size: null
      instance_zero_background: false
      zero_largest_instance: false
    batch_size: 32
    num_workers: 8
  eval_metric:
    eval_save_key: hard_f1
    overwrite_score: true
    name: MultiClassF1
    threshold: 0.5

consistency:
  consistency_dataloader:
    eval_dataset:
      name: StandardEvalDataset
      aug_name: predictions
      pred_path: [/g/kreshuk/talks/model_ranking/notebooks/model_selection/consistency/mitochondria/predictions]
      gt_path: [/g/kreshuk/talks/model_ranking/notebooks/model_selection/consistency/mitochondria/predictions]
      pred_key: predictions
      gt_key: predictions
      patch_key: patch_index
      roi: null
      ignore_index: null
      ignore_path: null
      ignore_key: null
      convert_to_binary_label: false
      convert_to_boundary_label: false
      relabel_background: false
      min_object_size: null
      instance_zero_background: false
      zero_largest_instance: false
    batch_size: 32
    num_workers: 8
  consistency_metric:
    save_key: EI_consis
    save_mask: false
    mask_threshold: 0.5
    overwrite_score: true
    bckg_consistency: false
    name: EI
    threshold: 0.5

