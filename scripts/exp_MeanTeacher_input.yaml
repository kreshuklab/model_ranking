  consistency_metric:
    name: "EI"
    threshold: 0.5
    save_key: null
    save_mask: null
    mask_threshold: 0.5
    overwrite_score: null
  transformer_cfg:
    raw:
      - name: AdditiveGaussianNoise
        execution_probability: 1
        scale: [0, 0.05]
  stats_cfg:
    pmin: null
    pmax: null
    mean: null
    std: null
    percentile_min: null
    percentile_max: null
