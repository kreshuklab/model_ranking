 ### Target Datasets
target_datasets:
  - name: EPFL

### Source Models
source_models:
  - source_name: EPFL
    model_name: model_test
    model_type: UNet2D

### Perturbation Settings

# Feature perturbations
feature_perturbations: null

# Input Augmentations
input_augs:
  none: []

### General Run Settings
overwrite_yaml: False
segmentation_mode: semantic
run_mode: pred_eval
data_base_path: /scratch/lage/data
model_dir_path: /g/kreshuk/lage/models

summary_results:
  overwrite_scores: False
  filter_patches: False
  eval_key: F1_eval
  consis_key: EI_consis
  save_name_postfix: _full

# Output Settings
output_settings:
  result_dir: predictions
  approach: default_selftraining
  output_folder: null
  base_dir_path: /g/kreshuk/lage/models/EPFL/UNet2D/model_test


### Performance and Consistency evaluation settings
eval_settings:
  name: MultiClassF1
  eval_save_key: F1_eval
  overwrite_score: False

consistency_settings: null
